[package]
name = "awspriv"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Stealth-first AWS access key permission assessment and ranking"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["aws", "iam", "security", "pentest", "stealth"]
categories = ["command-line-utilities"]

[lib]
name = "awspriv"
path = "src/lib.rs"

[[bin]]
name = "awspriv"
path = "src/main.rs"

[dependencies]
# AWS SDK. The default (stealth) path uses only sts + iam — everything else is
# probe-mode opt-in. Adding a service is one line in catalog.rs + one in probe.rs.
aws-config            = { version = "1.8", features = ["behavior-version-latest"] }
aws-credential-types  = "1.2"
aws-sdk-sts           = "1.80"
aws-sdk-iam           = "1.107"
# Probe targets — pulled in for the opt-in --probe / --aggressive modes.
aws-sdk-s3            = "1.110"
aws-sdk-ec2           = "1.130"
aws-sdk-lambda        = "1.95"
aws-sdk-secretsmanager = "1.85"
aws-sdk-kms           = "1.85"
aws-sdk-ssm           = "1.95"
aws-sdk-eks           = "1.85"
aws-sdk-ecr           = "1.85"

# Async + CLI
tokio       = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures     = "0.3"
clap        = { version = "4.5", features = ["derive", "env"] }
rand        = "0.8"

# Output / logging
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
comfy-table        = "7.1"
colored            = "2.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow      = "1.0"
urlencoding = "2.1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
